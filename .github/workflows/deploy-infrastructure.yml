name: Deploy Azure Container Apps Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - dev
          - qa

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Validate and Deploy - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    env:
      AZURE_LOCATION: centralindia

      RESOURCE_GROUP_NAME: ${{ inputs.environment == 'dev' && 'rg-springboot-app-dev' || 'rg-document-analysis-qa' }}

      LOG_ANALYTICS_NAME: ${{ inputs.environment == 'dev' && 'law-springboot-app-dev' || 'law-document-analysis-qa' }}

      CONTAINER_APPS_ENVIRONMENT_NAME: ${{ inputs.environment == 'dev' && 'cae-springboot-app-dev' || 'cae-document-analysis-qa' }}

      CONTAINER_APP_NAME: ${{ inputs.environment == 'dev' && 'ca-springboot-app-dev' || 'ca-document-analysis-qa' }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure authentication
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Validate Resource Group Bicep template
      - name: Validate Resource Group Bicep
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: validate
          name: validate-resource-group-${{ inputs.environment }}
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          location: ${{ env.AZURE_LOCATION }}
          template-file: infra/modules/resource-groups/spring-boot-app-rg.bicep
          parameters: |
            resourceGroupName: ${{ env.RESOURCE_GROUP_NAME }}
            location: ${{ env.AZURE_LOCATION }}
            tags:
              application: document-analysis
              environment: ${{ inputs.environment }}
              managedBy: bicep

      - name: Deploy Resource Group
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: create-resource-group-${{ inputs.environment }}
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          location: ${{ env.AZURE_LOCATION }}
          template-file: infra/modules/resource-groups/spring-boot-app-rg.bicep
          parameters: |
            resourceGroupName: ${{ env.RESOURCE_GROUP_NAME }}
            location: ${{ env.AZURE_LOCATION }}
            tags:
              application: document-analysis
              environment: ${{ inputs.environment }}
              managedBy: bicep



      - name: Validate Container Apps Bicep
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: validate
          name: validate-container-apps-${{ inputs.environment }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP_NAME }}
          template-file: infra/modules/container-apps/spring-boot-aca-dev.bicep
          parameters: |
            location: ${{ env.AZURE_LOCATION }}
            logAnalyticsName: ${{ env.LOG_ANALYTICS_NAME }}
            containerAppsEnvironmentName: ${{ env.CONTAINER_APPS_ENVIRONMENT_NAME }}
            containerAppName: ${{ env.CONTAINER_APP_NAME }}
            containerImage: ${{ vars.DOCKERHUB_USERNAME }}/spring-boot-app:latest
            targetPort: 8081
            externalIngress: true
            minReplicas: 0
            maxReplicas: 2
            cpu: 0.5
            memory: 1Gi
            appEnvironmentVariables:
              - name: SPRING_PROFILES_ACTIVE
                value: ${{ inputs.environment }}
            tags:
              application: document-analysis
              environment: ${{ inputs.environment }}
              managedBy: bicep

      # 5. Create or update Resource Group

      # 6. Preview changes before Container Apps deployment
      - name: What-If Container Apps Infrastructure
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: whatIf
          name: preview-container-apps-${{ inputs.environment }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP_NAME }}
          template-file: infra/modules/container-apps/spring-boot-aca-dev.bicep
          parameters: |
            location: ${{ env.AZURE_LOCATION }}
            logAnalyticsName: ${{ env.LOG_ANALYTICS_NAME }}
            containerAppsEnvironmentName: ${{ env.CONTAINER_APPS_ENVIRONMENT_NAME }}
            containerAppName: ${{ env.CONTAINER_APP_NAME }}
            containerImage: ${{ vars.DOCKERHUB_USERNAME }}/spring-boot-app:latest
            targetPort: 8081
            externalIngress: true
            minReplicas: 0
            maxReplicas: 2
            cpu: 0.5
            memory: 1Gi
            appEnvironmentVariables:
              - name: SPRING_PROFILES_ACTIVE
                value: ${{ inputs.environment }}
            tags:
              application: document-analysis
              environment: ${{ inputs.environment }}
              managedBy: bicep

      # 7. Deploy Container Apps infrastructure
      - name: Deploy Container Apps Infrastructure
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: deploy-container-apps-${{ inputs.environment }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP_NAME }}
          template-file: infra/modules/container-apps/spring-boot-aca-dev.bicep
          parameters: |
            location: ${{ env.AZURE_LOCATION }}
            logAnalyticsName: ${{ env.LOG_ANALYTICS_NAME }}
            containerAppsEnvironmentName: ${{ env.CONTAINER_APPS_ENVIRONMENT_NAME }}
            containerAppName: ${{ env.CONTAINER_APP_NAME }}
            containerImage: ${{ vars.DOCKERHUB_USERNAME }}/spring-boot-app:latest
            targetPort: 8081
            externalIngress: true
            minReplicas: 0
            maxReplicas: 2
            cpu: 0.5
            memory: 1Gi
            appEnvironmentVariables:
              - name: SPRING_PROFILES_ACTIVE
                value: ${{ inputs.environment }}
            tags:
              application: document-analysis
              environment: ${{ inputs.environment }}
              managedBy: bicep